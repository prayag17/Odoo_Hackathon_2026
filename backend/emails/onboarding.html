<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to TransitOps</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
            <tr>
              <td style="padding:40px 40px 24px 40px;">
                <p style="margin:0 0 8px 0; font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#6b7280;">
                  TransitOps
                </p>
                <h1 style="margin:0; font-size:22px; line-height:1.3; color:#111827;">
                  Welcome aboard, {{firstName}}
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px;">
                <p style="margin:0 0 20px 0; font-size:15px; line-height:1.6; color:#374151;">
                  Your account is ready. TransitOps helps you track fleets, routes, and schedules in one place — let's get you set up.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 32px 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:8px; background-color:#111827;">
                      <a href="{{dashboardUrl}}" style="display:inline-block; padding:12px 24px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">
                        Go to your dashboard
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 40px 40px 40px; border-top:1px solid #e5e7eb;">
                <p style="margin:24px 0 0 0; font-size:13px; line-height:1.6; color:#9ca3af;">
                  Sent to {{email}}. If you didn't create a TransitOps account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
